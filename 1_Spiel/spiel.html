<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Vollbild & iPhone/Safari Optimierung (verhindert Zoom und nutzt den gesamten Bildschirm inkl. Notch) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Apple iOS Web-App (PWA) Einstellungen für Vollbild ohne Safari-Leisten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZombieKoop">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#090d16">

  <link rel="manifest" href="/manifest.json">
  <title>Zombie Koop 2D</title>
  <link rel="stylesheet" href="design.css">
</head>
<body>

  <!-- 100% Vollbild-Spielfeld -->
  <canvas id="spielFeld"></canvas>

  <!-- Dezentes HUD (Head-Up-Display) über dem Spielfeld -->
  <div class="hud-oberflaeche">
    <!-- Links oben: Titel, Lebensbalken, Spieler-Zähler & Serverstatus -->
    <div class="hud-gruppe links-oben">
      <span class="spiel-titel">🧟 Zombie Koop</span>
      
      <!-- Lebensbalken -->
      <div class="leben-container">
        <span class="leben-icon">❤️</span>
        <div class="leben-balken-rahmen">
          <div class="leben-balken-fuellung" id="spieler-leben-fuellung"></div>
        </div>
        <span class="leben-text" id="spieler-leben-text">100</span>
      </div>

      <span class="zombie-badge" id="zombie-anzahl">🧟 0</span>
      <span class="spieler-badge" id="spieler-anzahl">1 Spieler</span>
      <div class="status-bereich" id="multiplayer-status">
        <span class="status-punkt offline" id="multiplayer-status-punkt"></span>
        <span class="status-text" id="multiplayer-status-text">Online</span>
      </div>
    </div>

    <!-- Rechts oben: Koordinaten & PC-Steuerungshinweis -->
    <div class="hud-gruppe rechts-oben">
      <div class="position-info" id="spieler-pos">X: 0 | Y: 0</div>
      <div class="pc-steuerung-info">PC: <kbd>WASD</kbd> | <kbd>Maus 🎯</kbd> | <kbd>Klick 💥</kbd></div>
    </div>
  </div>

  <!-- Hinweis bei Hochformat auf Smartphones -->
  <div id="querformat-hinweis">
    <div class="hinweis-box">
      <div class="dreh-symbol">🔄 📱</div>
      <h2>Bitte ins Querformat drehen</h2>
      <p>Zombie Koop ist für das Querformat (Landscape) optimiert.</p>
    </div>
  </div>

  <!-- Socket.IO Client vom Server -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Module des Spiels -->
  <script src="../3_Spieleinstellungen/einstellungen.js"></script>
  <script src="../2_Multiplayer/verbindung.js"></script>
  <script src="spiel.js"></script>
</body>
</html>
